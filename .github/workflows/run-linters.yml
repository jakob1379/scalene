name: linters

on:
  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

  workflow_dispatch:


# Cancel any in-flight runs for the same PR / branch when a new push arrives.
# Master pushes still run to completion (the ``cancel-in-progress`` predicate
# only fires on PR events).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  linters:
    runs-on: ubuntu-latest
    # mypy + ruff are pure static analysis: no native build needed and
    # results are version-independent given a single mypy target version
    # (the Python 3.12 interpreter below, as [tool.mypy] sets no
    # python_version) and ruff's target version (requires-python in
    # pyproject.toml). A single matrix entry
    # is enough; the C++ extension isn't installed because nothing here
    # imports it.
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          pyproject.toml

    - name: Install Python dependencies for linting
      # No ``pip install -e .`` here — mypy resolves the package via
      # ``mypy scalene`` (source directory) and missing C-extension
      # imports are silenced by ``ignore_missing_imports = true`` in
      # pyproject.toml. ruff is purely syntactic.
      #
      # The runtime dependencies are installed without building scalene:
      # mypy needs their types (without them it reports stale ignores),
      # and ``pydantic`` must be importable for ``plugins = ["pydantic.mypy"]``.
      run: |
        python -m pip install --upgrade pip
        python -m pip install --group lint
        python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']))" > "$RUNNER_TEMP/deps.txt"
        python -m pip install -r "$RUNNER_TEMP/deps.txt"

    - name: Run linters
      run: |
        mypy scalene
        ruff check scalene
